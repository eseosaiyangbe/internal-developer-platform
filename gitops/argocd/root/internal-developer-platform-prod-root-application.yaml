apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: internal-developer-platform-prod-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: internal-developer-platform
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/eseosaiyangbe/internal-developer-platform.git
    targetRevision: main
    path: gitops/argocd/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
