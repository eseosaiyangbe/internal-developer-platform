apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swiftpay-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: internal-developer-platform
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: internal-developer-platform-dev
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: api-gateway
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: auth-service
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: frontend
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: notification-service
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: transaction-service
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: wallet-service
      jsonPointers:
        - /spec/replicas
  source:
    repoURL: https://github.com/eseosaiyangbe/SwiftPay.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: swiftpay-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
