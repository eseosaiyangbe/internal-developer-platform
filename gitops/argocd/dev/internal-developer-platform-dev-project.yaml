apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: internal-developer-platform-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: internal-developer-platform
    environment: dev
spec:
  description: Development GitOps boundary for the Internal Developer Platform.
  sourceRepos:
    - https://github.com/eseosaiyangbe/internal-developer-platform.git
    - https://github.com/eseosaiyangbe/Obervability-Stack.git
    - https://github.com/eseosaiyangbe/MemFlip.git
    - https://github.com/eseosaiyangbe/SwiftPay.git
    - https://github.com/eseosaiyangbe/FoodPulse.git
    - https://github.com/eseosaiyangbe/OpenSIS.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: platform-observability-dev
      server: https://kubernetes.default.svc
    - namespace: memflip-dev
      server: https://kubernetes.default.svc
    - namespace: swiftpay-dev
      server: https://kubernetes.default.svc
    - namespace: foodpulse-dev
      server: https://kubernetes.default.svc
    - namespace: opensis-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
