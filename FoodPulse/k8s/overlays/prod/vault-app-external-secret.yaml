apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: foodpulse-app-secrets-external
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: foodpulse-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: FOODPULSE_DB_PASSWORD
      remoteRef:
        key: devops-easy-learning/foodpulse/prod/app
        property: FOODPULSE_DB_PASSWORD
    - secretKey: FOODPULSE_REDIS_PASSWORD
      remoteRef:
        key: devops-easy-learning/foodpulse/prod/app
        property: FOODPULSE_REDIS_PASSWORD
    - secretKey: FOODPULSE_REDIS_SENTINEL_PASSWORD
      remoteRef:
        key: devops-easy-learning/foodpulse/prod/app
        property: FOODPULSE_REDIS_SENTINEL_PASSWORD
