apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: foodpulse-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: foodpulse-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: foodpulse-ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: foodpulse-ui
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
