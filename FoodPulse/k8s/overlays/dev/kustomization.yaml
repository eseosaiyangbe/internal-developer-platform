apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foodpulse-dev

resources:
  - namespace.yaml
  - ../../base
  - vault-serviceaccount.yaml
  - vault-secret-store.yaml
  - vault-app-external-secret.yaml
  - vault-postgres-external-secret.yaml

images:
  - name: foodpulse-api
    newName: foodpulse-api
    newTag: dev
  - name: foodpulse-ui
    newName: foodpulse-ui
    newTag: dev

labels:
  - pairs:
      cluster: k3s
      environment: dev
    includeSelectors: false

patches:
  - path: dev-cnpg-ops-patch.yaml
  - path: dev-resource-requests-patch.yaml
  - path: dev-rollout-strategy-patch.yaml
  - target:
      kind: ConfigMap
      name: foodpulse-app-config
    patch: |-
      - op: replace
        path: /data/FOODPULSE_ALLOWED_ORIGIN
        value: https://foodpulse.eseosadevbox.com,http://foodpulse.devops.local
  - target:
      kind: Ingress
      name: foodpulse
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: foodpulse.devops.local
      - op: add
        path: /spec/rules/-
        value:
          host: foodpulse.eseosadevbox.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: foodpulse-ui
                    port:
                      number: 80
