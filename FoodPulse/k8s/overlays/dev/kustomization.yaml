apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foodpulse-dev

resources:
  - namespace.yaml
  - ../../base
  - postgres-app-secret.yaml

secretGenerator:
  - name: foodpulse-app-secrets
    envs:
      - dev-secrets.env

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: foodpulse-api
    newName: foodpulse-api
    newTag: dev
  - name: foodpulse-ui
    newName: foodpulse-ui
    newTag: dev

labels:
  - pairs:
      cluster: k3s
      environment: dev
    includeSelectors: false

patches:
  - target:
      kind: ConfigMap
      name: foodpulse-app-config
    patch: |-
      - op: replace
        path: /data/FOODPULSE_ALLOWED_ORIGIN
        value: http://foodpulse.devops.local
  - target:
      kind: Ingress
      name: foodpulse
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: foodpulse.devops.local
