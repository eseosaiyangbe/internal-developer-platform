apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foodpulse-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eseosaiyangbe/DevOps-Easy-Learning.git
    targetRevision: main
    path: FoodPulse/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: foodpulse-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
