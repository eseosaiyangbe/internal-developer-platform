apiVersion: v1
kind: Service
metadata:
  name: foodpulse-api
spec:
  selector:
    app.kubernetes.io/name: foodpulse-api
  ports:
    - name: http
      port: 4567
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodpulse-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: foodpulse-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foodpulse-api
    spec:
      containers:
        - name: api
          image: foodpulse-api:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: foodpulse-app-config
          env:
            - name: PORT
              value: "4567"
            - name: FOODPULSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodpulse-app-secrets
                  key: FOODPULSE_DB_PASSWORD
            - name: FOODPULSE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodpulse-app-secrets
                  key: FOODPULSE_REDIS_PASSWORD
            - name: FOODPULSE_REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodpulse-app-secrets
                  key: FOODPULSE_REDIS_SENTINEL_PASSWORD
          ports:
            - name: http
              containerPort: 4567
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
