apiVersion: v1
kind: Service
metadata:
  name: foodpulse-redis-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: foodpulse-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: v1
kind: Service
metadata:
  name: foodpulse-redis-sentinel
spec:
  selector:
    app.kubernetes.io/name: foodpulse-redis
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: foodpulse-redis
spec:
  serviceName: foodpulse-redis-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: foodpulse-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foodpulse-redis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /opt/foodpulse/redis-start.sh
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodpulse-app-secrets
                  key: FOODPULSE_REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-scripts
              mountPath: /opt/foodpulse
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: sentinel
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /opt/foodpulse/sentinel-start.sh
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodpulse-app-secrets
                  key: FOODPULSE_REDIS_PASSWORD
            - name: SENTINEL_QUORUM
              value: "2"
          ports:
            - name: sentinel
              containerPort: 26379
          volumeMounts:
            - name: sentinel-data
              mountPath: /sentinel
            - name: redis-scripts
              mountPath: /opt/foodpulse
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - redis-cli -p 26379 ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - redis-cli -p 26379 ping | grep -q PONG
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: redis-scripts
          configMap:
            name: foodpulse-redis-scripts
            defaultMode: 0755
        - name: sentinel-data
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
