apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foodpulse
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: foodpulse.devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: foodpulse-ui
                port:
                  number: 80
