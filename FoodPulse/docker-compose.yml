x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  foodpulse-ui:
    build:
      context: ./ui
    image: foodpulse-ui:local
    container_name: foodpulse-ui
    ports:
      - "127.0.0.1:${FOODPULSE_UI_HOST_PORT:-8090}:80"
    depends_on:
      - foodpulse-api
    networks:
      foodpulse-net:
      observability-net:
        aliases:
          - foodpulse-ui
    restart: always

  foodpulse-api:
    build:
      context: ./api
    image: foodpulse-api:local
    container_name: foodpulse-api
    depends_on:
      - pg-haproxy
      - redis-haproxy
    environment:
      FOODPULSE_DB_SERVER: ${FOODPULSE_DB_SERVER:-pg-haproxy}
      FOODPULSE_DB_PORT: ${FOODPULSE_DB_PORT:-5432}
      FOODPULSE_DB_NAME: ${FOODPULSE_DB_NAME:-foodpulse}
      FOODPULSE_DB_USER: ${FOODPULSE_DB_USER:-foodpulse}
      FOODPULSE_DB_PASSWORD: ${FOODPULSE_DB_PASSWORD:-change-me}
      FOODPULSE_REDIS_SERVER: ${FOODPULSE_REDIS_SERVER:-redis-haproxy}
      FOODPULSE_REDIS_PORT: ${FOODPULSE_REDIS_PORT:-6379}
      FOODPULSE_REDIS_PASSWORD: ${FOODPULSE_REDIS_PASSWORD:-admin}
      FOODPULSE_ALLOWED_ORIGIN: ${FOODPULSE_ALLOWED_ORIGIN:-http://localhost:8090}
      PORT: 4567
    ports:
      - "127.0.0.1:${FOODPULSE_API_HOST_PORT:-3102}:4567"
    networks:
      foodpulse-net:
      observability-net:
        aliases:
          - foodpulse-api
    restart: always

  redis-master:
    image: redis:7.2
    container_name: foodpulse-redis-master
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    logging: *default-logging
    volumes:
      - redis-master-data:/data
      - ./redis/master/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - foodpulse-net
    restart: always

  redis-replica-1:
    image: redis:7.2
    container_name: foodpulse-redis-replica1
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    logging: *default-logging
    volumes:
      - redis-replica-data:/data
      - ./redis/replica/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - foodpulse-net
    restart: always

  redis-replica-2:
    image: redis:7.2
    container_name: foodpulse-redis-replica2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    logging: *default-logging
    volumes:
      - redis-replica2-data:/data
      - ./redis/replica/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - foodpulse-net
    restart: always

  redis-sentinel-1:
    image: redis:7.2
    container_name: foodpulse-redis-sentinel01
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    logging: *default-logging
    volumes:
      - ./sentinel/sentinel-01.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - foodpulse-net
    ports:
      - "127.0.0.1:${FOODPULSE_SENTINEL_HOST_PORT:-26380}:26379"
    restart: always

  redis-sentinel-2:
    image: redis:7.2
    container_name: foodpulse-redis-sentinel02
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    logging: *default-logging
    volumes:
      - ./sentinel/sentinel-02.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - foodpulse-net
    restart: always

  redis-sentinel-3:
    image: redis:7.2
    container_name: foodpulse-redis-sentinel03
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    logging: *default-logging
    volumes:
      - ./sentinel/sentinel-03.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - foodpulse-net
    restart: always

  foodpulse-db:
    image: postgres:14
    container_name: foodpulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FOODPULSE_DB_PASSWORD:-change-me}
      POSTGRES_HOST_AUTH_METHOD: trust
      FOODPULSE_DB_NAME: ${FOODPULSE_DB_NAME:-foodpulse}
      FOODPULSE_DB_USER: ${FOODPULSE_DB_USER:-foodpulse}
      FOODPULSE_DB_PASSWORD: ${FOODPULSE_DB_PASSWORD:-change-me}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c listen_addresses='*'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/initdb/01-init-foodpulse.sh:/docker-entrypoint-initdb.d/01-init-foodpulse.sh:ro
      - ./postgres/initdb/02-create-replicator.sql:/docker-entrypoint-initdb.d/02-create-replicator.sql:ro
      - ./postgres/initdb/03-pghba-override.sh:/docker-entrypoint-initdb.d/03-pghba-override.sh:ro
    networks:
      - foodpulse-net
    restart: always

  postgres-replica-1:
    image: postgres:14
    container_name: foodpulse-db-replica1
    environment:
      POSTGRES_USER: ${FOODPULSE_DB_USER:-foodpulse}
      POSTGRES_PASSWORD: ${FOODPULSE_DB_PASSWORD:-change-me}
      POSTGRES_HOST_AUTH_METHOD: trust
      PGPASSWORD: ${PG_REPLICATOR_PASSWORD}
    depends_on:
      - foodpulse-db
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    volumes:
      - db-data1:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    networks:
      foodpulse-net:
        aliases:
          - foodpulse-db-replica1
    restart: always

  postgres-replica-2:
    image: postgres:14
    container_name: foodpulse-db-replica2
    environment:
      POSTGRES_USER: ${FOODPULSE_DB_USER:-foodpulse}
      POSTGRES_PASSWORD: ${FOODPULSE_DB_PASSWORD:-change-me}
      POSTGRES_HOST_AUTH_METHOD: trust
      PGPASSWORD: ${PG_REPLICATOR_PASSWORD}
    depends_on:
      - foodpulse-db
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    volumes:
      - db-data2:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    networks:
      foodpulse-net:
        aliases:
          - foodpulse-db-replica2
    restart: always

  postgres-replica-3:
    image: postgres:14
    container_name: foodpulse-db-replica3
    environment:
      POSTGRES_USER: ${FOODPULSE_DB_USER:-foodpulse}
      POSTGRES_PASSWORD: ${FOODPULSE_DB_PASSWORD:-change-me}
      POSTGRES_HOST_AUTH_METHOD: trust
      PGPASSWORD: ${PG_REPLICATOR_PASSWORD}
    depends_on:
      - foodpulse-db
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    volumes:
      - db-data3:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    networks:
      foodpulse-net:
        aliases:
          - foodpulse-db-replica3
    restart: always

  pg-haproxy:
    image: haproxy:2.9
    container_name: foodpulse-pg-haproxy
    depends_on:
      - foodpulse-db
      - postgres-replica-1
      - postgres-replica-2
      - postgres-replica-3
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${FOODPULSE_PG_RW_HOST_PORT:-5442}:5432"
      - "127.0.0.1:${FOODPULSE_PG_RO_HOST_PORT:-5443}:5433"
    networks:
      - foodpulse-net
    restart: always

  redis-haproxy:
    image: haproxy:2.9
    container_name: foodpulse-redis-haproxy
    logging: *default-logging
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    volumes:
      - ./haproxy/haproxy-redis.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${FOODPULSE_REDIS_HOST_PORT:-6380}:6379"
    networks:
      - foodpulse-net
    restart: always

networks:
  foodpulse-net:
    driver: bridge
  observability-net:
    name: observability-net
    external: true

# -------------------------
# Volumes
# -------------------------
volumes:
  db-data:
  db-data1:
  db-data2:
  db-data3:
  redis-master-data:
  redis-replica-data:
  redis-replica2-data:
