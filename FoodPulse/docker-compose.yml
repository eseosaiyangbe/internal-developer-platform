
services:
  # -------------------------
  # YELB frontend + appserver
  # -------------------------
  yelb-ui:
    platform: linux/amd64
    image: mreferre/yelb-ui:0.7
    container_name: foodpulse-yelb-ui
    ports:
      - "127.0.0.1:${FOODPULSE_UI_HOST_PORT:-8090}:80"
    depends_on:
      - yelb-appserver
    networks:
      yelbnet:
      observability-net:
        aliases:
          - foodpulse-ui
    restart: always

  yelb-appserver:
    platform: linux/amd64
    build:
      context: ./yelb/yelb-appserver
    image: foodpulse-yelb-appserver:local
    container_name: foodpulse-yelb-appserver
    depends_on:
      - pg-haproxy
      - redis-haproxy
    environment:
      - YELB_DB_SERVER=${YELB_DB_SERVER}
      - YELB_DB_NAME=${YELB_DB_NAME:-yelbdatabase}
      - YELB_DB_USER=${YELB_DB_USER}
      - YELB_DB_PASSWORD=${YELB_DB_PASSWORD}
      - YELB_REDIS_SERVER=${YELB_REDIS_SERVER}
      - YELB_REDIS_PASSWORD=${YELB_REDIS_PASSWORD}
    networks:
      - yelbnet
    restart: always

  # ------------------------------
  # Redis HA cluster (master + replicas)
  # ------------------------------
  redis-server:
    platform: linux/amd64
    image: redis:7.2
    container_name: foodpulse-redis-master
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-master-data:/data
      - ./redis/master/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - yelbnet
    restart: always

  odilia-redis01:
    platform: linux/amd64
    image: redis:7.2
    container_name: foodpulse-redis-replica1
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-replica-data:/data
      - ./redis/replica/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - yelbnet
    restart: always

  odilia-redis02:
    platform: linux/amd64
    image: redis:7.2
    container_name: foodpulse-redis-replica2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-replica2-data:/data
      - ./redis/replica/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - yelbnet
    restart: always

  # -------------------------
  # Redis Sentinels (3 nodes)
  # -------------------------
  odilia-redis-sentinel01:
    platform: linux/amd64
    image: redis:7.2
    container_name: foodpulse-redis-sentinel01
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    volumes:
      - ./sentinel/sentinel-01.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-server
      - odilia-redis01
      - odilia-redis02
    networks:
      - yelbnet
    ports:
      - "127.0.0.1:${FOODPULSE_SENTINEL_HOST_PORT:-26380}:26379"
    restart: always

  odilia-redis-sentinel02:
    platform: linux/amd64
    image: redis:7.2
    container_name: foodpulse-redis-sentinel02
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    volumes:
      - ./sentinel/sentinel-02.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-server
      - odilia-redis01
      - odilia-redis02
    networks:
      - yelbnet
    restart: always

  odilia-redis-sentinel03:
    platform: linux/amd64
    image: redis:7.2
    container_name: foodpulse-redis-sentinel03
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    volumes:
      - ./sentinel/sentinel-03.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-server
      - odilia-redis01
      - odilia-redis02
    networks:
      - yelbnet
    restart: always

  # ------------------------------
  # YELB DB (PRIMARY) - Postgres 14
  # ------------------------------
  yelb-db:
    platform: linux/amd64
    image: postgres:14
    container_name: foodpulse-yelb-db
    environment:
      POSTGRES_USER: ${YELB_DB_USER}
      POSTGRES_PASSWORD: ${YELB_DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c listen_addresses='*'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./yelb/yelb-db/init-yelb-db.sh:/docker-entrypoint-initdb.d/01-init-yelb-db.sh:ro
      - ./yelb-db/02-create-replicator.sql:/docker-entrypoint-initdb.d/02-create-replicator.sql:ro
      - ./yelb-db/03-pghba-override.sh:/docker-entrypoint-initdb.d/03-pghba-override.sh:ro
    networks:
      - yelbnet
    restart: always

  # ------------------------------------------
  # Postgres streaming replicas
  # ------------------------------------------
  odilia-db-replication01:
    platform: linux/amd64
    image: postgres:14
    container_name: foodpulse-yelb-db-replica1
    environment:
      POSTGRES_USER: ${YELB_DB_USER}
      POSTGRES_PASSWORD: ${YELB_DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
      PGPASSWORD: ${PG_REPLICATOR_PASSWORD}
    depends_on:
      - yelb-db
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    volumes:
      - db-data1:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    networks:
      yelbnet:
        aliases:
          - yelb-db-replica1
    restart: always

  odilia-db-replication02:
    platform: linux/amd64
    image: postgres:14
    container_name: foodpulse-yelb-db-replica2
    environment:
      POSTGRES_USER: ${YELB_DB_USER}
      POSTGRES_PASSWORD: ${YELB_DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
      PGPASSWORD: ${PG_REPLICATOR_PASSWORD}
    depends_on:
      - yelb-db
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    volumes:
      - db-data2:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    networks:
      yelbnet:
        aliases:
          - yelb-db-replica2
    restart: always

  odilia-db-replication03:
    platform: linux/amd64
    image: postgres:14
    container_name: foodpulse-yelb-db-replica3
    environment:
      POSTGRES_USER: ${YELB_DB_USER}
      POSTGRES_PASSWORD: ${YELB_DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
      PGPASSWORD: ${PG_REPLICATOR_PASSWORD}
    depends_on:
      - yelb-db
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    volumes:
      - db-data3:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    networks:
      yelbnet:
        aliases:
          - yelb-db-replica3
    restart: always

  # ------------------------------
  # HAProxy for Postgres routing
  # ------------------------------
  pg-haproxy:
    platform: linux/amd64
    image: haproxy:2.9
    container_name: foodpulse-pg-haproxy
    depends_on:
      - yelb-db
      - odilia-db-replication01
      - odilia-db-replication02
      - odilia-db-replication03
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${FOODPULSE_PG_RW_HOST_PORT:-5442}:5432"   # RW pool
      - "127.0.0.1:${FOODPULSE_PG_RO_HOST_PORT:-5443}:5433"   # RO pool
    networks:
      - yelbnet
    restart: always

  # ------------------------------
  # HAProxy for Redis routing
  # ------------------------------
  redis-haproxy:
    platform: linux/amd64
    image: haproxy:2.9
    container_name: foodpulse-redis-haproxy
    depends_on:
      - redis-server
      - odilia-redis01
      - odilia-redis02
    volumes:
      - ./haproxy/haproxy-redis.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${FOODPULSE_REDIS_HOST_PORT:-6380}:6379"   # Redis entrypoint for app
    networks:
      - yelbnet
    restart: always


# -------------------------
# Network
# -------------------------
networks:
  yelbnet:
    driver: bridge
  observability-net:
    name: observability-net
    external: true

# -------------------------
# Volumes
# -------------------------
volumes:
  db-data:
  db-data1:
  db-data2:
  db-data3:
  redis-master-data:
  redis-replica-data:
  redis-replica2-data:
