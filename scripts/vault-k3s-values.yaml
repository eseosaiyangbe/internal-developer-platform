server:
  enabled: true
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
      }

      storage "file" {
        path = "/vault/data"
      }
  dataStorage:
    enabled: true
    size: 10Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    activeService: false
    hosts:
      - host: vault.devops.local
        paths:
          - /

injector:
  enabled: false

ui:
  enabled: true
  serviceType: ClusterIP

authDelegator:
  enabled: true
