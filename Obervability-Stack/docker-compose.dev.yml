services:
  postgres:
    image: postgres:16-alpine
    container_name: observability-postgres-dev
    ports:
      - "${DB_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-observability_dev}
      POSTGRES_USER: ${DB_USER:-observability_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-observability_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-observability_app} -d ${DB_NAME:-observability_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - monitoring

  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dev
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki-dev
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - monitoring

  # Promtail - Log collection agent
  promtail:
    image: grafana/promtail:latest
    container_name: promtail-dev
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - loki

  # Alertmanager - Alert routing and silencing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager-dev
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - monitoring

  # Node Exporter - System metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-dev
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - monitoring

  # cAdvisor - Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor-dev
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    restart: unless-stopped
    networks:
      - monitoring

  devops-monitor-db-init:
    build:
      context: ./ui-next
      dockerfile: Dockerfile
      target: builder
      args:
        DATABASE_URL: ${BUILD_DATABASE_URL:-postgresql://build_user:build_password@build-postgres:5432/build_db?schema=public}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:4000}
        ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-true}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-database}
        NEXT_PUBLIC_ENABLE_DEMO_LOGIN: ${NEXT_PUBLIC_ENABLE_DEMO_LOGIN:-true}
    container_name: devops-monitor-db-init-dev
    command: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://observability_app:observability_dev_password@postgres:5432/observability_dev?schema=public}
    restart: "no"
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy

  # DevOps Monitor UI - Development mode with hot reloading
  devops-monitor-ui:
    build:
      context: ./ui-next
      dockerfile: Dockerfile
    container_name: devops-monitor-ui-dev
    command: ["npm", "run", "dev"]
    ports:
      - "4000:3000"
    volumes:
      - ./ui-next:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - WATCHPACK_POLLING=true
      - DATABASE_URL=${DATABASE_URL:-postgresql://observability_app:observability_dev_password@postgres:5432/observability_dev?schema=public}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:4000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-this-secret}
      - AUTH_MODE=${AUTH_MODE:-database}
      - ENABLE_DEMO_LOGIN=${ENABLE_DEMO_LOGIN:-true}
      - NEXT_PUBLIC_AUTH_MODE=${NEXT_PUBLIC_AUTH_MODE:-database}
      - NEXT_PUBLIC_ENABLE_DEMO_LOGIN=${NEXT_PUBLIC_ENABLE_DEMO_LOGIN:-true}
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
      devops-monitor-db-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
      loki:
        condition: service_started

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:

networks:
  monitoring:
    driver: bridge
