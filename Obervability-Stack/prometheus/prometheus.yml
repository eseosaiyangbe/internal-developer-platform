global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'devops-monitoring'
    replica: 'prometheus-1'
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"
  - "recording_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      timeout: 10s
      api_version: v2

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '${1}'

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '${1}'

  # Loki - Log aggregation metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  # Alertmanager - Alert management metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  # Grafana - Dashboard metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  # Promtail - Log shipping metrics
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  # Blackbox Exporter - HTTP uptime monitoring for local learning apps.
  # App containers join the shared observability-net Docker network with stable aliases.
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - labels:
          app: foodpulse
          component: frontend
        targets:
          - http://foodpulse-ui/
      - labels:
          app: memflip
          component: frontend
        targets:
          - http://memflip-frontend/api/health
      - labels:
          app: memflip
          component: backend
        targets:
          - http://memflip-backend:3001/health
      - labels:
          app: opensis
          component: frontend
        targets:
          - http://opensis-ui/
      - labels:
          app: swiftpay
          component: frontend
        targets:
          - http://swiftpay-frontend/
      - labels:
          app: swiftpay
          component: api-gateway
        targets:
          - http://swiftpay-api-gateway:3000/health
      - labels:
          app: swiftpay
          component: auth-service
        targets:
          - http://swiftpay-auth-service:3004/health
      - labels:
          app: swiftpay
          component: wallet-service
        targets:
          - http://swiftpay-wallet-service:3001/health
      - labels:
          app: swiftpay
          component: transaction-service
        targets:
          - http://swiftpay-transaction-service:3002/health
      - labels:
          app: swiftpay
          component: notification-service
        targets:
          - http://swiftpay-notification-service:3003/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # SwiftPay application metrics.
  # These are business and service metrics from the wallet/payment app, not just uptime probes.
  # The Docker Compose services join observability-net with stable aliases.
  - job_name: 'swiftpay-api-gateway'
    static_configs:
      - targets: ['swiftpay-api-gateway:3000']
        labels:
          app: swiftpay
          component: api-gateway
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  - job_name: 'swiftpay-auth-service'
    static_configs:
      - targets: ['swiftpay-auth-service:3004']
        labels:
          app: swiftpay
          component: auth-service
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  - job_name: 'swiftpay-wallet-service'
    static_configs:
      - targets: ['swiftpay-wallet-service:3001']
        labels:
          app: swiftpay
          component: wallet-service
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  - job_name: 'swiftpay-transaction-service'
    static_configs:
      - targets: ['swiftpay-transaction-service:3002']
        labels:
          app: swiftpay
          component: transaction-service
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  - job_name: 'swiftpay-notification-service'
    static_configs:
      - targets: ['swiftpay-notification-service:3003']
        labels:
          app: swiftpay
          component: notification-service
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  # OpenSIS MariaDB metrics.
  # The exporter runs beside the OpenSIS database and exposes database health to the shared control plane.
  - job_name: 'opensis-mariadb'
    static_configs:
      - targets: ['opensis-mysqld-exporter:9104']
        labels:
          app: opensis
          component: mariadb
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  # MemFlip application metrics.
  # The backend exposes bounded technical and game metrics on observability-net.
  - job_name: 'memflip-backend'
    static_configs:
      - targets: ['memflip-backend:3001']
        labels:
          app: memflip
          component: backend
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

  # FoodPulse application metrics.
  # The API exposes vote and Node.js process metrics on observability-net.
  - job_name: 'foodpulse-api'
    static_configs:
      - targets: ['foodpulse-api:4567']
        labels:
          app: foodpulse
          component: api
    scrape_interval: 15s
    metrics_path: /metrics
    honor_labels: true

