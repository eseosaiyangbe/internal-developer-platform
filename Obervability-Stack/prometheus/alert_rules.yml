groups:
  - name: node_alerts
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
          component: cpu
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-cpu-usage"

      # Critical CPU usage
      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          service: system
          component: cpu
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 95% for more than 2 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/critical-cpu-usage"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
          component: memory
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% for more than 5 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-memory-usage"

      # Critical memory usage
      - alert: CriticalMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 95
        for: 2m
        labels:
          severity: critical
          service: system
          component: memory
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 95% for more than 2 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/critical-memory-usage"

      # High disk usage
      - alert: HighDiskUsage
        expr: |
          max by(instance, device, fstype) (
            (
              node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|rpc_pipefs|nsfs|autofs|devtmpfs"}
              - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|rpc_pipefs|nsfs|autofs|devtmpfs"}
            )
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|rpc_pipefs|nsfs|autofs|devtmpfs"} * 100
          ) > 85
        for: 5m
        labels:
          severity: warning
          service: system
          component: disk
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage is above 85% for more than 5 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-disk-usage"

      # Critical disk usage
      - alert: CriticalDiskUsage
        expr: |
          max by(instance, device, fstype) (
            (
              node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|rpc_pipefs|nsfs|autofs|devtmpfs"}
              - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|rpc_pipefs|nsfs|autofs|devtmpfs"}
            )
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|rpc_pipefs|nsfs|autofs|devtmpfs"} * 100
          ) > 95
        for: 2m
        labels:
          severity: critical
          service: system
          component: disk
        annotations:
          summary: "Critical disk usage on {{ $labels.instance }}"
          description: "Disk usage is above 95% for more than 2 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/critical-disk-usage"

      # Node down
      - alert: NodeDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          service: system
          component: node
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "Node {{ $labels.instance }} has been down for more than 1 minute"
          runbook_url: "https://docs.example.com/runbooks/node-down"

      # High load average
      - alert: HighLoadAverage
        expr: node_load1 / on(instance) count by(instance) (count by(instance, cpu) (node_cpu_seconds_total{mode="idle"})) > 0.8
        for: 5m
        labels:
          severity: warning
          service: system
          component: load
        annotations:
          summary: "High load average on {{ $labels.instance }}"
          description: "1-minute load average is above 80% of available CPU cores for more than 5 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-load-average"

      # Network interface down
      - alert: NetworkInterfaceDown
        expr: node_network_up{device!~"lo|docker.*|br-.*|veth.*|flannel.*|cni.*|virbr.*|tun.*"} == 0
        for: 2m
        labels:
          severity: critical
          service: system
          component: network
        annotations:
          summary: "Network interface down on {{ $labels.instance }}"
          description: "Network interface {{ $labels.device }} is down on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/network-interface-down"

  - name: prometheus_alerts
    rules:
      # Prometheus down
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
          service: prometheus
          component: server
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus has been down for more than 1 minute"
          runbook_url: "https://docs.example.com/runbooks/prometheus-down"

      # High scrape duration
      - alert: HighScrapeDuration
        expr: scrape_duration_seconds > 10
        for: 5m
        labels:
          severity: warning
          service: prometheus
          component: scraping
        annotations:
          summary: "High scrape duration on {{ $labels.instance }}"
          description: "Scrape duration is above 10 seconds for more than 5 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-scrape-duration"

      # Prometheus configuration reload failed
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: critical
          service: prometheus
          component: config
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "Prometheus configuration reload has failed"
          runbook_url: "https://docs.example.com/runbooks/prometheus-config-reload-failed"

      # Prometheus storage corruption
      - alert: PrometheusStorageCorruption
        expr: prometheus_tsdb_head_series > 1000000
        for: 5m
        labels:
          severity: warning
          service: prometheus
          component: storage
        annotations:
          summary: "Prometheus storage corruption detected"
          description: "Prometheus has more than 1M series, possible storage corruption"
          runbook_url: "https://docs.example.com/runbooks/prometheus-storage-corruption"

  - name: container_alerts
    rules:
      # Container restarting frequently
      - alert: ContainerRestarting
        expr: increase(container_start_time_seconds[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: containers
          component: restart
        annotations:
          summary: "Container restarting frequently on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} has restarted in the last 15 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/container-restarting"

      # High container memory usage
      - alert: HighContainerMemoryUsage
        expr: (container_memory_working_set_bytes{job="cadvisor",id!="/",image!=""} / container_spec_memory_limit_bytes{job="cadvisor",id!="/",image!=""} * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: containers
          component: memory
        annotations:
          summary: "High container memory usage on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} memory working set is above 80% of its limit on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-container-memory-usage"

      # Critical container memory usage
      - alert: CriticalContainerMemoryUsage
        expr: (container_memory_working_set_bytes{job="cadvisor",id!="/",image!=""} / container_spec_memory_limit_bytes{job="cadvisor",id!="/",image!=""} * 100) > 95
        for: 2m
        labels:
          severity: critical
          service: containers
          component: memory
        annotations:
          summary: "Critical container memory usage on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} memory working set is above 95% of its limit on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/critical-container-memory-usage"

      # High container CPU usage
      - alert: HighContainerCPUUsage
        expr: (rate(container_cpu_usage_seconds_total{id!="/"}[5m]) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: containers
          component: cpu
        annotations:
          summary: "High container CPU usage on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} CPU usage is above 80% on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-container-cpu-usage"

      # Container OOMKilled
      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: containers
          component: oom
        annotations:
          summary: "Container OOMKilled on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} was OOMKilled on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/container-oomkilled"

  - name: application_alerts
    rules:
      # OpenSIS UI down
      - alert: OpenSISDown
        expr: probe_success{job="blackbox-http",app="opensis"} == 0
        for: 2m
        labels:
          severity: critical
          service: opensis
          app: opensis
          component: availability
        annotations:
          summary: "OpenSIS is down"
          description: "OpenSIS endpoint {{ $labels.instance }} has failed Blackbox probing for more than 2 minutes"
          runbook_url: "https://docs.example.com/runbooks/opensis-down"

      # OpenSIS high probe latency
      - alert: OpenSISHighProbeLatency
        expr: probe_duration_seconds{job="blackbox-http",app="opensis"} > 2
        for: 5m
        labels:
          severity: warning
          service: opensis
          app: opensis
          component: latency
        annotations:
          summary: "OpenSIS probe latency is high"
          description: "OpenSIS endpoint {{ $labels.instance }} has Blackbox probe latency above 2 seconds for more than 5 minutes"
          runbook_url: "https://docs.example.com/runbooks/opensis-high-latency"

      # SwiftPay component down
      - alert: SwiftPayComponentDown
        expr: probe_success{job="blackbox-http",app="swiftpay"} == 0
        for: 2m
        labels:
          severity: critical
          service: swiftpay
          app: swiftpay
          component: availability
        annotations:
          summary: "SwiftPay component is down"
          description: "SwiftPay {{ $labels.component }} endpoint {{ $labels.instance }} has failed Blackbox probing for more than 2 minutes"
          runbook_url: "https://docs.example.com/runbooks/swiftpay-component-down"

      # SwiftPay high probe latency
      - alert: SwiftPayHighProbeLatency
        expr: probe_duration_seconds{job="blackbox-http",app="swiftpay"} > 2
        for: 5m
        labels:
          severity: warning
          service: swiftpay
          app: swiftpay
          component: latency
        annotations:
          summary: "SwiftPay probe latency is high"
          description: "SwiftPay {{ $labels.component }} endpoint {{ $labels.instance }} has Blackbox probe latency above 2 seconds for more than 5 minutes"
          runbook_url: "https://docs.example.com/runbooks/swiftpay-high-latency"

      # SwiftPay Prometheus metrics scrape down
      - alert: SwiftPayMetricsScrapeDown
        expr: up{job=~"swiftpay-.+"} == 0
        for: 2m
        labels:
          severity: warning
          service: swiftpay
          app: swiftpay
          component: metrics
        annotations:
          summary: "SwiftPay metrics scrape is down"
          description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }} for more than 2 minutes"
          runbook_url: "file:///home/theinventor/Desktop/devops/devopseasylearning/SwiftPay/docs/send-money-runbook.md"

      # SwiftPay pending transactions stuck
      - alert: SwiftPayPendingTransactionsStuck
        expr: swiftpay_pending_transactions_total{job="swiftpay-transaction-service"} > 0 and (time() - swiftpay_transactions_oldest_pending_timestamp{job="swiftpay-transaction-service"}) > 120
        for: 1m
        labels:
          severity: critical
          service: swiftpay
          app: swiftpay
          component: transaction-service
        annotations:
          summary: "SwiftPay has pending transactions stuck"
          description: "{{ $value }} pending transaction signal detected. One or more SwiftPay transactions have been pending for more than 2 minutes."
          runbook_url: "file:///home/theinventor/Desktop/devops/devopseasylearning/SwiftPay/docs/send-money-runbook.md"

      # SwiftPay money stuck pending
      - alert: SwiftPayMoneyStuckPending
        expr: swiftpay_pending_transaction_amount_total{job="swiftpay-transaction-service"} > 0 and (time() - swiftpay_transactions_oldest_pending_timestamp{job="swiftpay-transaction-service"}) > 120
        for: 1m
        labels:
          severity: critical
          service: swiftpay
          app: swiftpay
          component: transaction-service
        annotations:
          summary: "SwiftPay money is stuck in pending state"
          description: "SwiftPay has ${{ $value }} stuck in pending transactions for more than 2 minutes."
          runbook_url: "file:///home/theinventor/Desktop/devops/devopseasylearning/SwiftPay/docs/send-money-runbook.md"

      # SwiftPay transaction queue depth high
      - alert: SwiftPayTransactionQueueDepthHigh
        expr: queue_depth{job="swiftpay-transaction-service",queue_name="transactions"} > 5
        for: 2m
        labels:
          severity: warning
          service: swiftpay
          app: swiftpay
          component: rabbitmq
        annotations:
          summary: "SwiftPay transaction queue depth is high"
          description: "SwiftPay transaction queue has {{ $value }} messages for more than 2 minutes. The worker may be slow or down."
          runbook_url: "file:///home/theinventor/Desktop/devops/devopseasylearning/SwiftPay/docs/send-money-runbook.md"

      # SwiftPay transaction failure rate
      - alert: SwiftPayTransactionFailureRateHigh
        expr: sum(rate(transactions_total{job="swiftpay-transaction-service",service="transaction-service",status="failed"}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
          service: swiftpay
          app: swiftpay
          component: transaction-service
        annotations:
          summary: "SwiftPay transaction failure rate is high"
          description: "SwiftPay transaction-service failure rate is {{ $value }} failed transactions per second over 5 minutes."
          runbook_url: "file:///home/theinventor/Desktop/devops/devopseasylearning/SwiftPay/docs/send-money-runbook.md"

      # SwiftPay wallet failure rate
      - alert: SwiftPayWalletFailureRateHigh
        expr: sum(rate(failed_transfers_total{job="swiftpay-wallet-service",service="wallet-service"}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
          service: swiftpay
          app: swiftpay
          component: wallet-service
        annotations:
          summary: "SwiftPay wallet transfer failure rate is high"
          description: "SwiftPay wallet-service failed transfer rate is {{ $value }} failures per second over 5 minutes."
          runbook_url: "file:///home/theinventor/Desktop/devops/devopseasylearning/SwiftPay/docs/send-money-runbook.md"

      # SwiftPay wallet circuit breaker open
      - alert: SwiftPayWalletCircuitBreakerOpen
        expr: swiftpay_circuit_breaker_state{job="swiftpay-transaction-service"} == 1
        for: 1m
        labels:
          severity: critical
          service: swiftpay
          app: swiftpay
          component: wallet-service
        annotations:
          summary: "SwiftPay wallet circuit breaker is open"
          description: "Transaction Service has opened the Wallet Service circuit breaker. Money movement may be blocked."
          runbook_url: "file:///home/theinventor/Desktop/devops/devopseasylearning/SwiftPay/docs/send-money-runbook.md"

      # High HTTP error rate
      - alert: HighHTTPErrorRate
        expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) * 100 > 5
        for: 5m
        labels:
          severity: warning
          service: application
          component: http
        annotations:
          summary: "High HTTP error rate on {{ $labels.instance }}"
          description: "HTTP error rate is above 5% for more than 5 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-http-error-rate"

      # Critical HTTP error rate
      - alert: CriticalHTTPErrorRate
        expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) * 100 > 10
        for: 2m
        labels:
          severity: critical
          service: application
          component: http
        annotations:
          summary: "Critical HTTP error rate on {{ $labels.instance }}"
          description: "HTTP error rate is above 10% for more than 2 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/critical-http-error-rate"

      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: application
          component: performance
        annotations:
          summary: "High response time on {{ $labels.instance }}"
          description: "95th percentile response time is above 1 second for more than 5 minutes on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-response-time"

      # Application down
      - alert: ApplicationDown
        expr: up{job=~"app.*"} == 0
        for: 1m
        labels:
          severity: critical
          service: application
          component: availability
        annotations:
          summary: "Application down on {{ $labels.instance }}"
          description: "Application {{ $labels.job }} is down on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/application-down"

  - name: infrastructure_alerts
    rules:
      # Grafana down
      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 1m
        labels:
          severity: critical
          service: grafana
          component: server
        annotations:
          summary: "Grafana is down"
          description: "Grafana has been down for more than 1 minute"
          runbook_url: "https://docs.example.com/runbooks/grafana-down"

      # Loki down
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 1m
        labels:
          severity: critical
          service: loki
          component: server
        annotations:
          summary: "Loki is down"
          description: "Loki has been down for more than 1 minute"
          runbook_url: "https://docs.example.com/runbooks/loki-down"

      # Alertmanager down
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
          service: alertmanager
          component: server
        annotations:
          summary: "Alertmanager is down"
          description: "Alertmanager has been down for more than 1 minute"
          runbook_url: "https://docs.example.com/runbooks/alertmanager-down"

      # Promtail down
      - alert: PromtailDown
        expr: up{job="promtail"} == 0
        for: 1m
        labels:
          severity: warning
          service: promtail
          component: agent
        annotations:
          summary: "Promtail is down"
          description: "Promtail has been down for more than 1 minute"
          runbook_url: "https://docs.example.com/runbooks/promtail-down"

  - name: database_alerts
    rules:
      # Database down
      - alert: DatabaseDown
        expr: up{job=~"postgres|mysql|redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: database
          component: availability
        annotations:
          summary: "Database down on {{ $labels.instance }}"
          description: "Database {{ $labels.job }} is down on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/database-down"

      # High database connections
      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
          service: database
          component: connections
        annotations:
          summary: "High database connections on {{ $labels.instance }}"
          description: "Database connections are above 80 on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-database-connections"

      # Slow database queries
      - alert: SlowDatabaseQueries
        expr: rate(pg_stat_database_tup_returned[5m]) / rate(pg_stat_database_tup_fetched[5m]) < 0.1
        for: 5m
        labels:
          severity: warning
          service: database
          component: performance
        annotations:
          summary: "Slow database queries on {{ $labels.instance }}"
          description: "Database query performance is degraded on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/slow-database-queries"
