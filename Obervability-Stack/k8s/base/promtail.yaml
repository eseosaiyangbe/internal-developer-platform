apiVersion: v1
kind: Service
metadata:
  name: promtail
spec:
  selector:
    app.kubernetes.io/name: promtail
  ports:
    - name: http
      port: 9080
      targetPort: http
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
    spec:
      automountServiceAccountToken: false
      serviceAccountName: default
      containers:
        - name: promtail
          image: grafana/promtail:3.5.8
          args:
            - -config.file=/etc/promtail/config.yml
          ports:
            - name: http
              containerPort: 9080
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: observability-promtail-config
        - name: run
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
