global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: devops-monitoring
    replica: prometheus-k8s-1

rule_files:
  - /etc/prometheus/alert_rules.yml
  - /etc/prometheus/recording_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      api_version: v2
      timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: promtail
    static_configs:
      - targets:
          - promtail:9080

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '${1}'

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '${1}'

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - labels:
          app: foodpulse
          component: frontend
        targets:
          - http://foodpulse-ui.foodpulse-dev.svc.cluster.local/
      - labels:
          app: memflip
          component: frontend
        targets:
          - http://memflip-frontend.memflip-dev.svc.cluster.local/api/health
      - labels:
          app: memflip
          component: backend
        targets:
          - http://memflip-backend.memflip-dev.svc.cluster.local:3001/health
      - labels:
          app: swiftpay
          component: frontend
        targets:
          - http://frontend.swiftpay-dev.svc.cluster.local/
      - labels:
          app: swiftpay
          component: api-gateway
        targets:
          - http://api-gateway.swiftpay-dev.svc.cluster.local/health
      - labels:
          app: swiftpay
          component: auth-service
        targets:
          - http://auth-service.swiftpay-dev.svc.cluster.local:3004/health
      - labels:
          app: swiftpay
          component: wallet-service
        targets:
          - http://wallet-service.swiftpay-dev.svc.cluster.local:3001/health
      - labels:
          app: swiftpay
          component: transaction-service
        targets:
          - http://transaction-service.swiftpay-dev.svc.cluster.local:3002/health
      - labels:
          app: swiftpay
          component: notification-service
        targets:
          - http://notification-service.swiftpay-dev.svc.cluster.local:3003/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: memflip-backend
    static_configs:
      - targets:
          - memflip-backend.memflip-dev.svc.cluster.local:3001
        labels:
          app: memflip
          component: backend

  - job_name: foodpulse-api
    static_configs:
      - targets:
          - foodpulse-api.foodpulse-dev.svc.cluster.local:4567
        labels:
          app: foodpulse
          component: api

  - job_name: swiftpay-api-gateway
    static_configs:
      - targets:
          - api-gateway.swiftpay-dev.svc.cluster.local:80
        labels:
          app: swiftpay
          component: api-gateway

  - job_name: swiftpay-auth-service
    static_configs:
      - targets:
          - auth-service.swiftpay-dev.svc.cluster.local:3004
        labels:
          app: swiftpay
          component: auth-service

  - job_name: swiftpay-wallet-service
    static_configs:
      - targets:
          - wallet-service.swiftpay-dev.svc.cluster.local:3001
        labels:
          app: swiftpay
          component: wallet-service

  - job_name: swiftpay-transaction-service
    static_configs:
      - targets:
          - transaction-service.swiftpay-dev.svc.cluster.local:3002
        labels:
          app: swiftpay
          component: transaction-service

  - job_name: swiftpay-notification-service
    static_configs:
      - targets:
          - notification-service.swiftpay-dev.svc.cluster.local:3003
        labels:
          app: swiftpay
          component: notification-service
