server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: platform-observability-dev-pods
    pipeline_stages:
      - cri: {}
    static_configs:
      - targets:
          - localhost
        labels:
          job: kubernetes-pods
          namespace: platform-observability-dev
          __path__: /var/log/pods/platform-observability-dev_*/*/*.log

  - job_name: memflip-dev-pods
    pipeline_stages:
      - cri: {}
    static_configs:
      - targets:
          - localhost
        labels:
          job: kubernetes-pods
          namespace: memflip-dev
          __path__: /var/log/pods/memflip-dev_*/*/*.log

  - job_name: swiftpay-dev-pods
    pipeline_stages:
      - cri: {}
    static_configs:
      - targets:
          - localhost
        labels:
          job: kubernetes-pods
          namespace: swiftpay-dev
          __path__: /var/log/pods/swiftpay-dev_*/*/*.log

  - job_name: foodpulse-dev-pods
    pipeline_stages:
      - cri: {}
    static_configs:
      - targets:
          - localhost
        labels:
          job: kubernetes-pods
          namespace: foodpulse-dev
          __path__: /var/log/pods/foodpulse-dev_*/*/*.log
