apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: observability-prometheus-config
    files:
      - prometheus.yml=config/prometheus.yml
      - alert_rules.yml=config/alert_rules.yml
      - recording_rules.yml=config/recording_rules.yml
  - name: observability-alertmanager-config
    files:
      - alertmanager.yml=config/alertmanager.yml
  - name: observability-loki-config
    files:
      - config.yml=config/loki-config.yml
  - name: observability-promtail-config
    files:
      - config.yml=config/promtail-config.yml
  - name: observability-blackbox-config
    files:
      - blackbox.yml=config/blackbox.yml
  - name: observability-grafana-datasources
    files:
      - datasource.yml=config/grafana-datasources.yml
  - name: observability-grafana-dashboard-provider
    files:
      - dashboard.yml=config/grafana-dashboard-provider.yml
  - name: observability-grafana-dashboards-system
    files:
      - node-exporter.json=config/grafana-dashboards/system/node-exporter.json
  - name: observability-grafana-dashboards-application
    files:
      - foodpulse-operations.json=config/grafana-dashboards/application/foodpulse-operations.json
      - memflip-onboarding.json=config/grafana-dashboards/application/memflip-onboarding.json
      - opensis-operations.json=config/grafana-dashboards/application/opensis-operations.json
      - swiftpay-money-flow.json=config/grafana-dashboards/application/swiftpay-money-flow.json

resources:
  - postgres-cluster.yaml
  - prometheus.yaml
  - alertmanager.yaml
  - loki.yaml
  - grafana.yaml
  - blackbox-exporter.yaml
  - promtail.yaml
  - node-exporter.yaml
  - cadvisor.yaml
  - ui.yaml
  - ingress.yaml
