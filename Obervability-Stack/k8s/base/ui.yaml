apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-ui-config
data:
  NODE_ENV: production
  PORT: "3000"
  SITE_NAME: DevOps Easy Learning Control Plane
  SITE_URL: http://controlplane.devops.local
  SITE_DESCRIPTION: Shared observability control plane for the DevOps Easy Learning workspace
  NEXT_PUBLIC_API_URL: http://controlplane.devops.local/api
  AUTH_MODE: database
  ENABLE_DEMO_LOGIN: "true"
  NEXT_PUBLIC_AUTH_MODE: database
  NEXT_PUBLIC_ENABLE_DEMO_LOGIN: "true"
  PROMETHEUS_URL: http://prometheus:9090
  GRAFANA_URL: http://grafana:3000
  LOKI_URL: http://loki:3100
  ALERTMANAGER_URL: http://alertmanager:9093
  NODE_EXPORTER_URL: http://node-exporter:9100
  PROMTAIL_URL: http://promtail:9080
  BLACKBOX_EXPORTER_URL: http://blackbox-exporter:9115
  CADVISOR_URL: http://cadvisor:8080
  NODE_EXPORTER_ENABLED: "true"
  CADVISOR_ENABLED: "true"
  NEXT_PUBLIC_PROMETHEUS_BROWSER_URL: http://prometheus:9090
  NEXT_PUBLIC_GRAFANA_BROWSER_URL: http://grafana.devops.local
  NEXT_PUBLIC_LOKI_BROWSER_URL: http://loki:3100/ready
  NEXT_PUBLIC_ALERTMANAGER_BROWSER_URL: http://alertmanager:9093
  NEXT_PUBLIC_NODE_EXPORTER_BROWSER_URL: http://node-exporter:9100
  NEXT_PUBLIC_PROMTAIL_BROWSER_URL: http://promtail:9080
  NEXT_PUBLIC_BLACKBOX_EXPORTER_BROWSER_URL: http://blackbox-exporter:9115
  NEXT_PUBLIC_CADVISOR_BROWSER_URL: http://cadvisor:8080
  NOTIFICATION_STORE_PATH: /app/data/notification-events.json
---
apiVersion: v1
kind: Service
metadata:
  name: devops-monitor-ui
spec:
  selector:
    app.kubernetes.io/name: devops-monitor-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: devops-monitor-db-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-monitor-db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: devops-monitor-db-init:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed"]
          envFrom:
            - configMapRef:
                name: observability-ui-config
            - secretRef:
                name: observability-ui-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-monitor-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-monitor-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-monitor-ui
    spec:
      containers:
        - name: ui
          image: devops-monitor-ui:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: observability-ui-config
            - secretRef:
                name: observability-ui-secrets
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: data
          emptyDir: {}
