apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: observability-postgres
spec:
  instances: 1
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: observability_dev
      owner: observability_app
      secret:
        name: observability-postgres-app
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 768Mi
  storage:
    size: 5Gi
