apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: observability-postgres
spec:
  instances: 1
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: observability_dev
      owner: observability_app
      secret:
        name: observability-postgres-app
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 5Gi
