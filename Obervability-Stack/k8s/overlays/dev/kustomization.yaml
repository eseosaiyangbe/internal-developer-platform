apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-observability-dev

resources:
  - namespace.yaml
  - vault-serviceaccount.yaml
  - vault-secret-store.yaml
  - vault-postgres-external-secret.yaml
  - vault-ui-external-secret.yaml
  - vault-grafana-external-secret.yaml
  - ../../base

images:
  - name: devops-monitor-ui:dev
    newName: devops-monitor-ui
    newTag: dev
  - name: devops-monitor-db-init:dev
    newName: devops-monitor-db-init
    newTag: dev

labels:
  - pairs:
      cluster: k3s
      environment: dev
      secret-source: vault
    includeSelectors: false

patches:
  - path: dev-cnpg-ops-patch.yaml
  - path: dev-resource-requests-patch.yaml
  - path: dev-rollout-strategy-patch.yaml
  - target:
      kind: ConfigMap
      name: observability-ui-config
    patch: |-
      - op: replace
        path: /data/SITE_URL
        value: https://portfolio.eseosadevbox.com
      - op: replace
        path: /data/NEXT_PUBLIC_API_URL
        value: https://portfolio.eseosadevbox.com/api
      - op: replace
        path: /data/NEXT_PUBLIC_GRAFANA_BROWSER_URL
        value: https://grafana.eseosadevbox.com
  - target:
      kind: Ingress
      name: devops-monitor-ui
    patch: |-
      - op: add
        path: /spec/rules/-
        value:
          host: portfolio.eseosadevbox.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: devops-monitor-ui
                    port:
                      number: 3000
  - target:
      kind: Ingress
      name: grafana
    patch: |-
      - op: add
        path: /spec/rules/-
        value:
          host: grafana.eseosadevbox.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: grafana
                    port:
                      number: 3000
  - target:
      kind: Cluster
      name: observability-postgres
    patch: |-
      - op: replace
        path: /spec/bootstrap/initdb/database
        value: observability_dev
      - op: replace
        path: /spec/bootstrap/initdb/owner
        value: observability_app
