apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-grafana-admin-external
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: observability-grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: devops-easy-learning/observability/dev/grafana
        property: admin_user
    - secretKey: admin-password
      remoteRef:
        key: devops-easy-learning/observability/dev/grafana
        property: admin_password
