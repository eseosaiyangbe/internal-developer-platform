apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-ui-secrets-external
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: observability-ui-secrets
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: 'postgresql://{{ .username }}:{{ .password }}@observability-postgres-rw:5432/{{ .database }}?schema=public'
        NEXTAUTH_SECRET: '{{ .nextauth_secret }}'
  data:
    - secretKey: username
      remoteRef:
        key: devops-easy-learning/observability/dev/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: devops-easy-learning/observability/dev/postgres
        property: password
    - secretKey: database
      remoteRef:
        key: devops-easy-learning/observability/dev/postgres
        property: database
    - secretKey: nextauth_secret
      remoteRef:
        key: devops-easy-learning/observability/dev/ui
        property: NEXTAUTH_SECRET
