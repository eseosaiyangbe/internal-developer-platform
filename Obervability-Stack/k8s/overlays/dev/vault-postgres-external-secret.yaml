apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-postgres-app-external
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: observability-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: devops-easy-learning/observability/dev/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: devops-easy-learning/observability/dev/postgres
        property: password
