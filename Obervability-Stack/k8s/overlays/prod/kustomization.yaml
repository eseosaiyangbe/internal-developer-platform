apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-observability-prod

resources:
  - namespace.yaml
  - vault-serviceaccount.yaml
  - vault-secret-store.yaml
  - vault-postgres-external-secret.yaml
  - vault-ui-external-secret.yaml
  - vault-grafana-external-secret.yaml
  - prod-hpa.yaml
  - prod-pdb.yaml
  - ../../base

labels:
  - pairs:
      cluster: k3s
      environment: prod
      secret-source: vault
    includeSelectors: false

patches:
  - path: prod-placement-patch.yaml
  - target:
      kind: ConfigMap
      name: observability-ui-config
    patch: |-
      - op: replace
        path: /data/SITE_URL
        value: https://controlplane.prod.example.com
      - op: replace
        path: /data/NEXT_PUBLIC_API_URL
        value: https://controlplane.prod.example.com/api
      - op: replace
        path: /data/NEXT_PUBLIC_GRAFANA_BROWSER_URL
        value: https://grafana.prod.example.com
      - op: replace
        path: /data/ENABLE_DEMO_LOGIN
        value: "false"
      - op: replace
        path: /data/NEXT_PUBLIC_ENABLE_DEMO_LOGIN
        value: "false"
  - target:
      kind: Cluster
      name: observability-postgres
    patch: |-
      - op: replace
        path: /spec/instances
        value: 3
      - op: replace
        path: /spec/bootstrap/initdb/database
        value: observability_prod
      - op: replace
        path: /spec/storage/size
        value: 20Gi
  - target:
      kind: StatefulSet
      name: prometheus
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 25Gi
  - target:
      kind: StatefulSet
      name: loki
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 25Gi
  - target:
      kind: Deployment
      name: devops-monitor-ui
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Ingress
      name: devops-monitor-ui
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: web,websecure
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: replace
        path: /spec/rules/0/host
        value: controlplane.prod.example.com
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - controlplane.prod.example.com
            secretName: controlplane-prod-tls
  - target:
      kind: Ingress
      name: grafana
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: web,websecure
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: replace
        path: /spec/rules/0/host
        value: grafana.prod.example.com
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - grafana.prod.example.com
            secretName: grafana-prod-tls
