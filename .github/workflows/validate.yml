name: Validate Repository

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "gitops/**"
      - "k8s/**"
      - ".yamllint.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "gitops/**"
      - "k8s/**"
      - ".yamllint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Install validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --upgrade pip
          python -m pip install yamllint

          ACTIONLINT_VERSION=1.7.7
          curl -sSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp
          sudo install /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          actionlint

      - name: Lint shell scripts
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          shell_scripts=()
          if [ -n "${DIFF_BASE:-}" ] && git rev-parse --verify "${DIFF_BASE}^{commit}" >/dev/null 2>&1; then
            mapfile -t shell_scripts < <(git diff --name-only "${DIFF_BASE}" "${DIFF_HEAD}" -- 'scripts/*.sh' 'scripts/**/*.sh' | sort -u)
          fi
          if [ "${#shell_scripts[@]}" -gt 0 ]; then
            shellcheck "${shell_scripts[@]}"
            for script in "${shell_scripts[@]}"; do
              bash -n "${script}"
            done
          fi

      - name: Validate Hermes Python entrypoint
        run: |
          set -euo pipefail
          python -m py_compile scripts/hermes-agent.py

      - name: Lint YAML files
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          yaml_files=()
          if [ -n "${DIFF_BASE:-}" ] && git rev-parse --verify "${DIFF_BASE}^{commit}" >/dev/null 2>&1; then
            mapfile -t yaml_files < <(
              git diff --name-only "${DIFF_BASE}" "${DIFF_HEAD}" -- \
                '.github/workflows/*.yml' '.github/workflows/*.yaml' \
                'gitops/**/*.yml' 'gitops/**/*.yaml' \
                'k8s/**/*.yml' 'k8s/**/*.yaml' \
                'scripts/**/*.yml' 'scripts/**/*.yaml' | sort -u
            )
          fi
          if [ "${#yaml_files[@]}" -gt 0 ]; then
            python -m yamllint -c .yamllint.yml -s "${yaml_files[@]}"
          fi

      - name: Render Kubernetes and GitOps manifests
        run: |
          set -euo pipefail
          kubectl kustomize gitops/argocd/dev >/tmp/idp-argocd-dev.yaml
          kubectl kustomize gitops/argocd/prod >/tmp/idp-argocd-prod.yaml
          kubectl kustomize k8s/platform/cert-manager >/tmp/idp-cert-manager.yaml

      - name: Validate manifest document structure
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml

          files = [
              "/tmp/idp-argocd-dev.yaml",
              "/tmp/idp-argocd-prod.yaml",
              "/tmp/idp-cert-manager.yaml",
              "gitops/argocd/root/internal-developer-platform-dev-root-application.yaml",
              "gitops/argocd/root/internal-developer-platform-prod-root-application.yaml",
          ]

          for file_path in files:
              with open(file_path, "r", encoding="utf-8") as handle:
                  docs = [doc for doc in yaml.safe_load_all(handle) if doc is not None]
              if not docs:
                  raise SystemExit(f"{file_path}: no YAML documents found")
              for index, doc in enumerate(docs, start=1):
                  if not isinstance(doc, dict):
                      raise SystemExit(f"{file_path}: document {index} is not a YAML object")
                  if not doc.get("apiVersion") or not doc.get("kind"):
                      raise SystemExit(f"{file_path}: document {index} is missing apiVersion or kind")
                  metadata = doc.get("metadata")
                  if not isinstance(metadata, dict) or not metadata.get("name"):
                      raise SystemExit(f"{file_path}: document {index} is missing metadata.name")

          print(f"Validated {len(files)} manifest files")
          PY

      - name: Summarize validation coverage
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Validation Coverage

          - GitHub Actions workflow linting via `actionlint`
          - Shell script linting via `shellcheck` and `bash -n`
          - Python syntax validation for the Hermes operator entrypoint
          - YAML linting via `yamllint`
          - `kubectl kustomize` render checks for GitOps and cert-manager manifests
          - Offline YAML document checks for rendered GitOps and root application contracts
          EOF
