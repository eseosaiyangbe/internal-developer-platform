apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memflip-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devops-easy-learning
    environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/eseosaiyangbe/DevOps-Easy-Learning.git
    targetRevision: main
    path: MemFlip/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: memflip-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
