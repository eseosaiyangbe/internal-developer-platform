apiVersion: apps/v1
kind: Deployment
metadata:
  name: memflip-backend
  labels:
    app.kubernetes.io/name: memflip-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: devops-easy-learning
    observability.dev/app: memflip
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memflip-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memflip-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: devops-easy-learning
        observability.dev/app: memflip
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: memflip-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: API_PORT
            - name: DB_HOST
              value: memflip-postgres
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memflip-app-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: memflip-redis
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memflip-app-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: memflip-app-secrets
                  key: JWT_SECRET
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: API_BASE_URL
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: FRONTEND_URL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: CORS_ORIGIN
            - name: RATE_LIMIT_WINDOW_MS
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: RATE_LIMIT_WINDOW_MS
            - name: RATE_LIMIT_MAX_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: RATE_LIMIT_MAX_REQUESTS
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: memflip-backend
  labels:
    app.kubernetes.io/name: memflip-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: devops-easy-learning
    observability.dev/app: memflip
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3001"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app.kubernetes.io/name: memflip-backend
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: memflip-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: devops-easy-learning
    observability.dev/app: memflip
spec:
  selector:
    app.kubernetes.io/name: memflip-backend
  ports:
    - name: http
      port: 3001
      targetPort: http
