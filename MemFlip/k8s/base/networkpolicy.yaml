apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memflip-default-deny
  labels:
    app.kubernetes.io/name: memflip
    app.kubernetes.io/component: network
    app.kubernetes.io/part-of: devops-easy-learning
    observability.dev/app: memflip
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memflip-frontend-policy
  labels:
    app.kubernetes.io/name: memflip-frontend
    app.kubernetes.io/component: network
    app.kubernetes.io/part-of: devops-easy-learning
    observability.dev/app: memflip
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: memflip-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - platform-observability-dev
                  - platform-observability-prod
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - blackbox-exporter
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: memflip-backend
      ports:
        - protocol: TCP
          port: 3001
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memflip-backend-policy
  labels:
    app.kubernetes.io/name: memflip-backend
    app.kubernetes.io/component: network
    app.kubernetes.io/part-of: devops-easy-learning
    observability.dev/app: memflip
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: memflip-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: memflip-frontend
      ports:
        - protocol: TCP
          port: 3001
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3001
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - platform-observability-dev
                  - platform-observability-prod
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - prometheus
                  - blackbox-exporter
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: memflip-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: memflip-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
