apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app-config.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

configMapGenerator:
  - name: memflip-db-init
    files:
      - 01-combined-init.sql=combined-init.sql

generatorOptions:
  disableNameSuffixHash: true
