apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memflip-prod

resources:
  - namespace.yaml
  - vault-serviceaccount.yaml
  - vault-secret-store.yaml
  - vault-external-secret.yaml
  - prod-hpa.yaml
  - prod-pdb.yaml
  - ../../base

labels:
  - pairs:
      environment: prod
      secret-source: vault
    includeSelectors: false

images:
  - name: memflip-backend
    newName: memflip-backend
    newTag: prod
  - name: memflip-frontend
    newName: memflip-frontend
    newTag: prod

patches:
  - path: prod-placement-patch.yaml
  - target:
      kind: ConfigMap
      name: memflip-app-config
    patch: |-
      - op: replace
        path: /data/FRONTEND_URL
        value: https://memflip.eseosadevbox.com
      - op: replace
        path: /data/CORS_ORIGIN
        value: https://memflip.eseosadevbox.com
  - target:
      kind: Ingress
      name: memflip
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {}
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: web,websecure
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: replace
        path: /spec/rules/0/host
        value: memflip.eseosadevbox.com
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - memflip.eseosadevbox.com
            secretName: memflip-prod-tls
  - target:
      kind: Deployment
      name: memflip-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
  - target:
      kind: Deployment
      name: memflip-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
  - target:
      kind: StatefulSet
      name: memflip-postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: StatefulSet
      name: memflip-redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 4Gi
