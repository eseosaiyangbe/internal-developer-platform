apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: memflip-backend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memflip-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: memflip-frontend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memflip-frontend
