apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memflip-app-secrets-external
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: memflip-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: devops-easy-learning/memflip/prod/app
        property: DB_PASSWORD
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: devops-easy-learning/memflip/prod/app
        property: REDIS_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: devops-easy-learning/memflip/prod/app
        property: JWT_SECRET
