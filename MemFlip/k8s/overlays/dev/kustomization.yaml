apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memflip-dev

resources:
  - namespace.yaml
  - ../../base

secretGenerator:
  - name: memflip-app-secrets
    envs:
      - dev-secrets.env

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: memflip-backend
    newName: memflip-backend
    newTag: dev
  - name: memflip-frontend
    newName: memflip-frontend
    newTag: dev

patches:
  - target:
      kind: ConfigMap
      name: memflip-app-config
    patch: |-
      - op: replace
        path: /data/FRONTEND_URL
        value: http://memflip.devops.local
      - op: replace
        path: /data/CORS_ORIGIN
        value: http://memflip.devops.local
