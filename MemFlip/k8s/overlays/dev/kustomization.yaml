apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memflip-dev

resources:
  - namespace.yaml
  - vault-serviceaccount.yaml
  - vault-secret-store.yaml
  - vault-external-secret.yaml
  - ../../base

images:
  - name: memflip-backend
    newName: memflip-backend
    newTag: dev
  - name: memflip-frontend
    newName: memflip-frontend
    newTag: dev

patches:
  - path: dev-resource-requests-patch.yaml
  - path: dev-rollout-strategy-patch.yaml
  - target:
      kind: ConfigMap
      name: memflip-app-config
    patch: |-
      - op: replace
        path: /data/FRONTEND_URL
        value: https://memflip.eseosadevbox.com
      - op: replace
        path: /data/CORS_ORIGIN
        value: https://memflip.eseosadevbox.com,http://memflip.devops.local
  - target:
      kind: Ingress
      name: memflip
    patch: |-
      - op: add
        path: /spec/rules/-
        value:
          host: memflip.eseosadevbox.com
          http:
            paths:
              - path: /api
                pathType: Prefix
                backend:
                  service:
                    name: memflip-backend
                    port:
                      number: 3001
              - path: /debug
                pathType: Prefix
                backend:
                  service:
                    name: memflip-backend
                    port:
                      number: 3001
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: memflip-frontend
                    port:
                      number: 80
