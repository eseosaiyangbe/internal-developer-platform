apiVersion: apps/v1
kind: Deployment
metadata:
  name: memflip-frontend
  labels:
    app.kubernetes.io/name: memflip-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: devops-easy-learning
    observability.dev/app: memflip
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memflip-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memflip-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: devops-easy-learning
        observability.dev/app: memflip
    spec:
      containers:
        - name: frontend
          image: memflip-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: API_BASE_URL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: memflip-app-config
                  key: NODE_ENV
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: memflip-frontend
  labels:
    app.kubernetes.io/name: memflip-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: devops-easy-learning
    observability.dev/app: memflip
spec:
  selector:
    app.kubernetes.io/name: memflip-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
