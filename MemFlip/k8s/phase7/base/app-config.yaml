apiVersion: v1
kind: ConfigMap
metadata:
  name: memflip-app-config
  labels:
    app.kubernetes.io/name: memflip
    app.kubernetes.io/part-of: devops-easy-learning
    observability.dev/app: memflip
data:
  NODE_ENV: "production"
  API_PORT: "3001"
  DB_NAME: "humor_memory_game"
  DB_USER: "gameuser"
  DB_PORT: "5432"
  REDIS_PORT: "6379"
  API_BASE_URL: "/api"
  FRONTEND_URL: "http://memflip.devops.local"
  CORS_ORIGIN: "http://memflip.devops.local"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "250"
