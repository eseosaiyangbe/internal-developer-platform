apiVersion: v1
kind: Service
metadata:
  name: memflip-redis
  labels:
    app.kubernetes.io/name: memflip-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: devops-easy-learning
    observability.dev/app: memflip
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: memflip-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memflip-redis
  labels:
    app.kubernetes.io/name: memflip-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: devops-easy-learning
    observability.dev/app: memflip
spec:
  serviceName: memflip-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memflip-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memflip-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: devops-easy-learning
        observability.dev/app: memflip
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memflip-app-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app.kubernetes.io/name: memflip-redis
          app.kubernetes.io/component: cache
          app.kubernetes.io/part-of: devops-easy-learning
          observability.dev/app: memflip
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
